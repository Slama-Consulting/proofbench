<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d"><title id="t">How Proofbench works</title><desc id="d">You ask, the router picks a skill, the skill drives an MCP server, the server produces a proof-backed report.</desc><rect width="1200" height="430" rx="18" fill="#0d1117"/><text x="600" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="middle">From one sentence to a proven result</text><rect x="50" y="100" width="196" height="120" rx="12" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.8"/><text x="148" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">1  You ask</text><text x="148" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">"analyze this bug"</text><path d="M252 160 H268" stroke="#8b949e" stroke-width="2"/><path d="M262 154 L270 160 L262 166" fill="none" stroke="#8b949e" stroke-width="2"/><rect x="276" y="100" width="196" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.8"/><text x="374" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="middle">2  The router</text><text x="374" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">using-proofbench</text><path d="M478 160 H494" stroke="#8b949e" stroke-width="2"/><path d="M488 154 L496 160 L488 166" fill="none" stroke="#8b949e" stroke-width="2"/><rect x="502" y="100" width="196" height="120" rx="12" fill="#161b22" stroke="#3fb950" stroke-opacity="0.8"/><text x="600" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">3  A skill</text><text x="600" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">regression-trace</text><path d="M704 160 H720" stroke="#8b949e" stroke-width="2"/><path d="M714 154 L722 160 L714 166" fill="none" stroke="#8b949e" stroke-width="2"/><rect x="728" y="100" width="196" height="120" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity="0.8"/><text x="826" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#d29922" text-anchor="middle">4  An MCP server</text><text x="826" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">regression-tracer</text><path d="M930 160 H946" stroke="#8b949e" stroke-width="2"/><path d="M940 154 L948 160 L940 166" fill="none" stroke="#8b949e" stroke-width="2"/><rect x="954" y="100" width="196" height="120" rx="12" fill="#161b22" stroke="#a371f7" stroke-opacity="0.8"/><text x="1052" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a371f7" text-anchor="middle">5  A report</text><text x="1052" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">proven, sourced</text><rect x="60" y="266" width="350" height="124" rx="12" fill="#161b22" stroke="#30363d"/><text x="80" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Automatic</text><text x="80" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">The router is injected at session start (Claude Code hook)</text><text x="80" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">or read from AGENTS.md, copilot-instructions.md, GEMINI.md.</text><rect x="430" y="266" width="350" height="124" rx="12" fill="#161b22" stroke="#30363d"/><text x="450" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Proven</text><text x="450" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">The server runs the commands itself and computes the score</text><text x="450" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">from the evidence. The agent does not grade itself.</text><rect x="800" y="266" width="350" height="124" rx="12" fill="#161b22" stroke="#30363d"/><text x="820" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Safe</text><text x="820" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">Logs, tickets, APKs and commits are data, never orders.</text><text x="820" y="348" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">Every external write asks for your approval.</text></svg>
