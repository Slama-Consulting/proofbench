<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d"><title id="t">Compatible AI coding assistants</title><desc id="d">Claude Code, GitHub Copilot, Codex, Cursor and Gemini CLI.</desc><rect width="1200" height="250" rx="18" fill="#0d1117"/><text x="600" y="50" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="middle">One repository, five assistants</text><rect x="64" y="86" width="200" height="110" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity="0.8"/><text x="164" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#d29922" text-anchor="middle">Claude Code</text><text x="164" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">plugin + hook</text><rect x="282" y="86" width="200" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.8"/><text x="382" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle">GitHub Copilot</text><text x="382" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">skills + VS Code MCP</text><rect x="500" y="86" width="200" height="110" rx="12" fill="#161b22" stroke="#3fb950" stroke-opacity="0.8"/><text x="600" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3fb950" text-anchor="middle">Codex</text><text x="600" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">skills + config.toml</text><rect x="718" y="86" width="200" height="110" rx="12" fill="#161b22" stroke="#a371f7" stroke-opacity="0.8"/><text x="818" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a371f7" text-anchor="middle">Cursor</text><text x="818" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">rule + MCP</text><rect x="936" y="86" width="200" height="110" rx="12" fill="#161b22" stroke="#39c5cf" stroke-opacity="0.8"/><text x="1036" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#39c5cf" text-anchor="middle">Gemini CLI</text><text x="1036" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">extension + GEMINI.md</text><text x="600" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">Agent Skills format (SKILL.md) + stdio MCP servers: the two standards these assistants read.</text></svg>
