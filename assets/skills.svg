<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-labelledby="t d"><title id="t">The seven Proofbench skills</title><desc id="d">regression-trace, fix-bug, build-feature, clean-up, security-audit, analyze-apk and read-ticket, with their trigger phrases.</desc><rect width="1200" height="562" rx="18" fill="#0d1117"/><text x="600" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="middle">Seven skills, one sentence to trigger them</text><text x="600" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="middle">You never have to name the skill.</text><rect x="18" y="110" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="18" y="110" width="6" height="196" rx="3" fill="#58a6ff"/><text x="40" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="start">regression-trace</text><text x="40" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"analyze this bug"</text><text x="40" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"since when does it crash?"</text><text x="40" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"which commit broke this?"</text><text x="40" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Finds the culprit commit, bisects,</text><text x="40" y="265" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">proven verdict</text><text x="40" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: regression-tracer</text><rect x="314" y="110" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="314" y="110" width="6" height="196" rx="3" fill="#f85149"/><text x="336" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#f85149" text-anchor="start">fix-bug</text><text x="336" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"fix this bug"</text><text x="336" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"apply the fix"</text><text x="336" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Fix on a branch, test fails then</text><text x="336" y="265" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">passes</text><text x="336" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: workflow-gate</text><rect x="610" y="110" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="610" y="110" width="6" height="196" rx="3" fill="#3fb950"/><text x="632" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#3fb950" text-anchor="start">build-feature</text><text x="632" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"add this feature"</text><text x="632" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"implement this"</text><text x="632" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Need, plan, test first, code,</text><text x="632" y="265" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">proofs</text><text x="632" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: workflow-gate</text><rect x="906" y="110" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="906" y="110" width="6" height="196" rx="3" fill="#d29922"/><text x="928" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#d29922" text-anchor="start">clean-up</text><text x="928" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"clean up this module"</text><text x="928" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"remove dead code"</text><text x="928" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Tidy-up without changing behaviour</text><text x="928" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: workflow-gate</text><rect x="166" y="326" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="166" y="326" width="6" height="196" rx="3" fill="#a371f7"/><text x="188" y="360" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#a371f7" text-anchor="start">security-audit</text><text x="188" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"secure the app"</text><text x="188" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"any secrets in the repo?"</text><text x="188" y="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Secrets, Android manifest, staging</text><text x="188" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">API</text><text x="188" y="508" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: workflow-gate</text><rect x="462" y="326" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="462" y="326" width="6" height="196" rx="3" fill="#39c5cf"/><text x="484" y="360" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#39c5cf" text-anchor="start">analyze-apk</text><text x="484" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"analyze this APK"</text><text x="484" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"reverse engineering"</text><text x="484" y="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Manifest, signature, classes,</text><text x="484" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">strings, leads</text><text x="484" y="508" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: apk-inspector</text><rect x="758" y="326" width="276" height="196" rx="12" fill="#161b22" stroke="#30363d"/><rect x="758" y="326" width="6" height="196" rx="3" fill="#db61a2"/><text x="780" y="360" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" fill="#db61a2" text-anchor="start">read-ticket</text><text x="780" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"look at this ticket"</text><text x="780" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">"what is PROJ-123 about?"</text><text x="780" y="464" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">Jira, GitHub, GitLab, Linear:</text><text x="780" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">summary and next step</text><text x="780" y="508" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">MCP: ticket-reader</text></svg>
